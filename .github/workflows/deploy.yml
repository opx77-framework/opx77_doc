name: Deploy documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs are not cancelled: the last push wins.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          # lastModified on each page is read from git history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # MDX compiles, front matter, internal links and their anchors.
      - name: Check content
        run: node scripts/check-content.mjs

      # The framework (opx_infinity, opx_lib) lives in other repositories, so
      # there is no checkout here and this step reports a skip. Run the same
      # script locally, next to the framework, with Lua 5.4 installed: it boots
      # opx_infinity on its stub host and fails on any published name the docs
      # do not document. See scripts/check-api-coverage.sh.
      - name: Check API coverage
        run: ./scripts/check-api-coverage.sh

      - name: Type check
        run: npm run types:check

      - name: Build site
        run: npm run build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
