#   docs/resources/opx77_elevators.md
# --------------------------------------------------------------------------- #
nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - Architecture: architecture.md
      - The Open77 platform: platform.md
  - Resources:
      - Overview: resources/index.md
      - opx77_core: resources/opx77_core.md
      - opx77_menu: resources/opx77_menu.md
      - opx77_hud: resources/opx77_hud.md
      - opx77_chat: resources/opx77_chat.md
      - opx77_status: resources/opx77_status.md
      - opx77_weather: resources/opx77_weather.md
      - opx77_elevators: resources/opx77_elevators.md
