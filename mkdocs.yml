site_name: OPX//77
site_description: Documentation for the OPX//77 roleplay framework for OPEN//77.
site_url: https://opx77-framework.github.io/opx77_doc/
repo_url: https://github.com/opx77-framework/opx77_doc
repo_name: opx77-framework/opx77_doc
edit_uri: edit/main/docs/

copyright: OPX//77 is an independent community project, not affiliated with or endorsed by CD PROJEKT RED.

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  # URLs shared in support channels outlive page paths. Every page the site
  # published before opx_infinity (the sixteen opx77_* resources, the old
  # concepts and guides) redirects to the page that now answers its question.
  - redirects:
      redirect_maps:
        getting-started.md: getting-started/install.md
        guides/getting-started.md: getting-started/install.md
        guides/troubleshooting.md: getting-started/troubleshooting.md
