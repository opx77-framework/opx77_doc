site_name: OPX//77
site_description: Documentation for the OPX//77 roleplay framework for OPEN//77.
site_url: https://opx77-framework.github.io/opx77_doc/
repo_url: https://github.com/opx77-framework/opx77_doc
repo_name: opx77-framework/opx77_doc
edit_uri: edit/main/docs/

copyright: OPX//77 is an independent community project, not affiliated with or endorsed by CD PROJEKT RED.

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  # URLs shared in support channels outlive page paths. Every path the site
  # published before the guides/concepts/reference split still resolves.
  - redirects:
      redirect_maps:
        getting-started.md: guides/getting-started.md
        resources/index.md: reference/index.md
        resources/opx77_core.md: reference/opx77_core/index.md
        resources/opx77_menu.md: reference/opx77_menu/index.md
        resources/opx77_hud.md: reference/opx77_hud/index.md
        resources/opx77_chat.md: reference/opx77_chat/index.md
        resources/opx77_status.md: reference/opx77_status/index.md
        resources/opx77_weather.md: reference/opx77_weather/index.md
        resources/opx77_elevators.md: reference/opx77_elevators/index.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md

  - Guides:
      - Getting started: guides/getting-started.md
      - Converting from ESX or Qbox: guides/converting.md
      - Writing a resource: guides/writing-a-resource.md
      - Writing a server plugin: guides/writing-a-server-plugin.md
      - Troubleshooting: guides/troubleshooting.md
      - FAQ: guides/faq.md
      - Contributing: guides/contributing.md

  - Concepts:
      - Architecture: concepts/architecture.md
      - The Open77 platform: concepts/the-platform.md
      - The export contract: concepts/export-contract.md
      - Integration channels: concepts/integration-channels.md
      - Identity: concepts/identity.md
      - The entry gate: concepts/entry-gate.md
      - Persistence: concepts/persistence.md

  - Reference:
      - Overview: reference/index.md
      - opx77_core:
          - Overview: reference/opx77_core/index.md
          - Exports:
              - client: reference/opx77_core/exports/client.md
              - server: reference/opx77_core/exports/server.md
          - Server API: reference/opx77_core/server-api.md
          - Player: reference/opx77_core/player.md
          - Hooks: reference/opx77_core/hooks.md
          - Events: reference/opx77_core/events.md
          - Commands: reference/opx77_core/commands.md
          - Configuration: reference/opx77_core/config.md
          - Jobs, gangs and origins: reference/opx77_core/data.md
          - Permissions: reference/opx77_core/permissions.md
          - Types: reference/opx77_core/types.md
      - opx77_menu:
          - Overview: reference/opx77_menu/index.md
          - Exports: reference/opx77_menu/exports.md
          - The menu spec: reference/opx77_menu/menu-spec.md
          - Events: reference/opx77_menu/events.md
          - Configuration: reference/opx77_menu/config.md
          - Types: reference/opx77_menu/types.md
      - opx77_hud:
          - Overview: reference/opx77_hud/index.md
          - Exports: reference/opx77_hud/exports.md
          - Events: reference/opx77_hud/events.md
          - Commands: reference/opx77_hud/commands.md
          - Configuration: reference/opx77_hud/config.md
      - opx77_chat:
          - Overview: reference/opx77_chat/index.md
          - Exports: reference/opx77_chat/exports.md
          - Events: reference/opx77_chat/events.md
          - Configuration: reference/opx77_chat/config.md
      - opx77_status:
          - Overview: reference/opx77_status/index.md
          - Exports: reference/opx77_status/exports.md
          - The effect spec: reference/opx77_status/effect-spec.md
          - Events: reference/opx77_status/events.md
          - Configuration: reference/opx77_status/config.md
      - opx77_weather:
          - Overview: reference/opx77_weather/index.md
          - Exports: reference/opx77_weather/exports.md
          - Commands: reference/opx77_weather/commands.md
          - Events: reference/opx77_weather/events.md
          - Configuration: reference/opx77_weather/config.md
      - opx77_elevators:
          - Overview: reference/opx77_elevators/index.md
          - Exports: reference/opx77_elevators/exports.md
          - Error codes: reference/opx77_elevators/errors.md
          - Events: reference/opx77_elevators/events.md
          - Commands: reference/opx77_elevators/commands.md
          - Configuration: reference/opx77_elevators/config.md
          - Types: reference/opx77_elevators/types.md
      - opx77_lib: reference/opx77_lib.md

  - Releases: releases.md
