site_name: OPX//77
site_description: Documentation for the OPX//77 roleplay framework for OPEN//77.
site_url: https://opx77-framework.github.io/opx77_doc/
repo_url: https://github.com/opx77-framework/opx77_doc
repo_name: opx77-framework/opx77_doc
edit_uri: edit/main/docs/

copyright: OPX//77 is an independent community project, not affiliated with or endorsed by CD PROJEKT RED.

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

# --------------------------------------------------------------------------- #
# NAVIGATION
#
# The seven pages under "Resources" are placeholders. Other agents write them.
# Do not rename or move these paths -- they are the agreed contract:
